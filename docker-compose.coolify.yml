services:
  gateway:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    volumes:
      - hermes_data:/opt/data
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GATEWAY_ALLOW_ALL_USERS=true
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    command:
      - sh
      - -c
      - "/opt/hermes/bin/hermes config set model.provider gemini || true; /opt/hermes/bin/hermes config set model.default gemini-3.5-flash || true; /opt/hermes/bin/hermes gateway run; echo GATEWAY_STOPPED rc=$?; sleep 3600"
volumes:
  hermes_data:
